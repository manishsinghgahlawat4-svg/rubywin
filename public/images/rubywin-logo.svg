<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="RubyWin logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#5a0f24"/>
      <stop offset="60%" stop-color="#2a0812"/>
      <stop offset="100%" stop-color="#12050a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c2"/>
      <stop offset="45%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#9a5d0c"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9aa6"/>
      <stop offset="40%" stop-color="#e3184a"/>
      <stop offset="100%" stop-color="#7a0b25"/>
    </linearGradient>
    <linearGradient id="gemLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <!-- coin base -->
  <circle cx="80" cy="80" r="76" fill="url(#gold)"/>
  <circle cx="80" cy="80" r="70" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity=".9"/>
  <circle cx="80" cy="80" r="64" fill="none" stroke="#f7d98a" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- sparkles -->
  <g fill="#fff3c2" opacity=".9">
    <path d="M38 44l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path d="M124 52l1.5 4.5 4.5 1.5-4.5 1.5-1.5 4.5-1.5-4.5-4.5-1.5 4.5-1.5z"/>
    <path d="M118 110l1.2 3.6 3.6 1.2-3.6 1.2-1.2 3.6-1.2-3.6-3.6-1.2 3.6-1.2z"/>
  </g>

  <!-- ruby gem -->
  <g filter="url(#shadow)">
    <path d="M80 34 L108 56 L80 100 L52 56 Z" fill="url(#gem)"/>
    <path d="M62 56 L98 56 L80 34 Z" fill="#ff6b82"/>
    <path d="M52 56 L62 56 L80 100 Z" fill="#9d1033"/>
    <path d="M98 56 L108 56 L80 100 Z" fill="#b91440"/>
    <path d="M62 56 L80 100 L98 56 Z" fill="#e3184a"/>
    <path d="M66 42 L80 36 L92 44 L80 54 Z" fill="url(#gemLight)"/>
    <path d="M80 34 L108 56 L80 100 L52 56 Z" fill="none" stroke="url(#gold)" stroke-width="2" filter="url(#glow)"/>
  </g>

  <!-- crown -->
  <path d="M58 30 L66 20 L74 29 L80 14 L86 29 L94 20 L102 30 Z" fill="url(#gold)" stroke="#6b3d05" stroke-width=".8"/>
  <circle cx="66" cy="19" r="2.2" fill="#fff3c2"/><circle cx="80" cy="13" r="2.6" fill="#fff3c2"/><circle cx="94" cy="19" r="2.2" fill="#fff3c2"/>

  <!-- wordmark -->
  <text x="80" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" letter-spacing="1.5" fill="url(#gold)" filter="url(#shadow)">RUBYWIN</text>
  <text x="80" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="7" letter-spacing="3.2" fill="#f7d98a" opacity=".85">PLAY · WIN · SHINE</text>
</svg>
